[package]
name = "mpz-zk-core"
version = "0.1.0-alpha.6"
edition = "2024"

[features]
default = []
rayon = ["dep:rayon", "mpz-core/rayon", "blake3/rayon", "itybity/rayon"]

[dependencies]
mpz-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-circuits = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-memory-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-vm-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }

thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
blake3 = { version = "1.8.2", features = ["serde"] }
cfg-if = "1"
rangeset = { version = "0.4", features = ["serde"] }
rayon = { version = "1", optional = true }
itybity = "0.3"
zerocopy = "0.8"
rand_chacha = "0.9"

[dev-dependencies]
mpz-circuits = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["aes"] }
mpz-ot-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["test-utils"] }
rand = "0.9"
criterion = { version = "0.5", default-features = false }
aes = "0.9.0-rc.1"
rstest = "0.12"

[[bench]]
name = "prover"
harness = false

[[bench]]
name = "verifier"
harness = false
