[package]
name = "mpz-zk"
version = "0.1.0-alpha.6"
edition = "2024"


[features]
default = []
rayon = ["mpz-zk-core/rayon", "blake3/rayon"]
mock = ["mpz-ot/ideal"]

[dependencies]
mpz-vm-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-zk-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }

async-trait = { version = "0.1" }
blake3 = { version = "1.8.2", features = ["serde"] }
derive_builder = { version = "0.12" }
futures = { version = "0.3" }
thiserror = { version = "1" }
serio = { version = "0.2" }


bincode = "1.3"
