[package]
name = "mpz-core"
version = "0.1.0-alpha.6"
edition = "2024"

[lib]
name = "mpz_core"

[features]
default = ["cointoss"]
cointoss = ["dep:rand_chacha"]
rayon = ["dep:rayon"]

[dependencies]
aes = { version = "0.9.0-rc.1", features = [] }
cipher = "0.5.0-rc.1"
blake3 = "1.8.2"
clmul = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
rand = "0.9"
rand_chacha = { version = "0.9", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1"
once_cell = "1"
itybity = "0.3"
opaque-debug = "0.3"
bcs = "0.1.5"
rand_core_06 = { package = "rand_core", version = "0.6" }
rand_core = { version = "0.9" }
bytemuck = { version = "1.13", features = ["derive"] }
hybrid-array = "0.4"
rayon = { version = "1", optional = true }
cfg-if = "1"
bitvec = { version = "1.0", features = ["serde"] }

[dev-dependencies]
rstest = "0.12"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "aes"
harness = false

[[bench]]
name = "ggm"
harness = false

[[bench]]
name = "prg"
harness = false

[[bench]]
name = "lpn"
harness = false
