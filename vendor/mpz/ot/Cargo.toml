[package]
name = "mpz-ot"
version = "0.1.0-alpha.6"
edition = "2024"


[lib]
name = "mpz_ot"

[features]
default = []
rayon = ["mpz-ot-core/rayon"]
ideal = ["mpz-common/ideal", "serde"]
test-utils = ["mpz-ot-core/test-utils", "mpz-common/test-utils"]

[dependencies]
tracing = "0.1"
mpz-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["sync"] }
mpz-cointoss = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-ot-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }

async-trait = { version = "0.1" }
futures = { version = "0.3" }
rand = { version = "0.9" }
rand_core = { version = "0.9" }
rand_chacha = { version = "0.9" }
p256 = { version = "0.10", optional = true }
thiserror = { version = "1" }
itybity = { version = "0.3" }
enum-try-as-inner = { version = "0.1.0" }
opaque-debug = { version = "0.3" }
serde = { version = "1.0", optional = true }
serio = { version = "0.2" }
cfg-if = { version = "1" }
tokio = { version = "1.23", default-features = false, features = ["sync"] }

[dev-dependencies]
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = [
    "test-utils",
    "ideal",
    "executor",
] }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["ideal"] }
mpz-ot-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["test-utils"] }
rstest = { version = "0.12" }
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
tokio = { version = "1.23", default-features = false, features = [
    "net",
    "macros",
    "rt",
    "rt-multi-thread",
] }

[[bench]]
name = "shared"
harness = false

[[bench]]
name = "ferret_sender"
harness = false

[[bench]]
name = "ferret_receiver"
harness = false
