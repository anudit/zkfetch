[workspace]
resolver = "2"
exclude = ["vendor"]
members = [
  "crates/zkf-core",
  "crates/zkf-notary",
  "crates/zkf-prover",
  "crates/zkf-verifier",
  "crates/zkf-fixture",
  "crates/zkf-napi",
  "crates/zkf-predicates",
  "crates/zkf-tls13",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
zkf-core = { path = "crates/zkf-core" }
zkf-notary = { path = "crates/zkf-notary" }
zkf-prover = { path = "crates/zkf-prover" }
zkf-verifier = { path = "crates/zkf-verifier" }
zkf-predicates = { path = "crates/zkf-predicates" }
zkf-tls13-schedule = { package = "tlsn-tls13-schedule", path = "vendor/tlsn/crates/components/tls13-schedule" }
zkf-tls13 = { path = "crates/zkf-tls13" }

# Binius64 ZK mode, pinned for reproducible circuits and proof encoding.
binius-circuits = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-frontend = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-hash = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-prover = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }
binius-verifier = { git = "https://github.com/binius-zk/binius64", rev = "6a179536d90fcc76eeca0cee4e059f5e17efb459" }

# TLSNotary, pinned to a release tag and patched to the vendored copy in
# vendor/tlsn (see vendor/tlsn/ZKFETCH_PATCHES.md) for TLS 1.3 and QuickSilver
# predicates. Intended to be upstreamed (tlsn #859, #978, #1001).
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-server-fixture = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }

anyhow = "1.0"
async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
bincode = "1.3"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rand-binius = { package = "rand", version = "0.10.1" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
ws_stream_tungstenite = { version = "0.15", features = ["tokio_io"] }

# MPC is far too slow unoptimized; keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[patch."https://github.com/tlsnotary/tlsn"]
tlsn = { path = "vendor/tlsn/crates/tlsn" }
tlsn-attestation = { path = "vendor/tlsn/crates/attestation" }
tlsn-cipher = { path = "vendor/tlsn/crates/components/cipher" }
tlsn-core = { path = "vendor/tlsn/crates/core" }
tlsn-deap = { path = "vendor/tlsn/crates/components/deap" }
tlsn-formats = { path = "vendor/tlsn/crates/formats" }
tlsn-hmac-sha256 = { path = "vendor/tlsn/crates/components/hmac-sha256" }
tlsn-key-exchange = { path = "vendor/tlsn/crates/components/key-exchange" }
tlsn-mpc-tls = { path = "vendor/tlsn/crates/mpc-tls" }
tlsn-server-fixture = { path = "vendor/tlsn/crates/server-fixture/server" }
tlsn-server-fixture-certs = { path = "vendor/tlsn/crates/server-fixture/certs" }
tlsn-tls-client = { path = "vendor/tlsn/crates/tls/client" }
tlsn-tls-core = { path = "vendor/tlsn/crates/tls/core" }

[patch."https://github.com/privacy-ethereum/mpz"]
mpz-common = { path = "vendor/mpz/common" }
