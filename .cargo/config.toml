# Browser builds (crates/zkf-wasm) take randomness from crypto.getRandomValues.
# SIMD128 (Chrome 91+, Firefox 89+, Safari 16.4+) makes the software AES and
# carry-less multiplication used in wasm about 26% faster end to end.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'target-feature=+simd128']
