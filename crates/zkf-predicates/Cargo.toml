[package]
name = "zkf-predicates"
description = "QuickSilver predicates and optional legacy Binius verification"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
legacy-binius = ["zkf-core/legacy-binius", "dep:binius-circuits", "dep:binius-core", "dep:binius-frontend", "dep:binius-hash", "dep:binius-prover", "dep:binius-verifier", "dep:rand-binius"]

[dependencies]
zkf-core.workspace = true
tlsn.workspace = true
tlsn-formats.workspace = true
binius-circuits = { workspace = true, optional = true }
binius-core = { workspace = true, optional = true }
binius-frontend = { workspace = true, optional = true }
binius-hash = { workspace = true, optional = true }
binius-prover = { workspace = true, optional = true }
binius-verifier = { workspace = true, optional = true }
rand-binius = { workspace = true, optional = true }
anyhow.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
blake3 = "1"

[dev-dependencies]
tlsn = { workspace = true, features = ["security-test-support"] }
