[package]
name = "zkf-voleith"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
parallel = ["faest/parallel", "zkf-ir/parallel", "dep:rayon"]

[dependencies]
web-time = "1"
rayon = {version="1",optional=true}
zkf-ir.workspace = true
zkf-attestation.workspace = true
k256.workspace = true
httparse = "1"
serde_json.workspace = true
faest = { path = "../../vendor/faest", default-features = false, features = ["std", "zeroize"] }
anyhow.workspace = true
bincode.workspace = true
serde.workspace = true
rand.workspace = true
sha3 = "0.10"
zeroize = { version = "1", features = ["derive"] }
spongefish = { path = "../../vendor/spongefish/spongefish", default-features = false, features = ["sha3"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
aes = "0.8"
aes-gcm = "0.10"
