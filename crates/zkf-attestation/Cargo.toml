[package]
name = "zkf-attestation"
description = "Deterministic v2 attestation and ciphertext opening primitives"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
k256.workspace = true
ciborium = "0.2"
bao = "0.13"
