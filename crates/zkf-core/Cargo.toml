[package]
name = "zkf-core"
description = "Shared types, wire framing and transport for zkfetch"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
legacy-binius = []

[dependencies]
zkf-attestation.workspace = true
bincode.workspace = true
tracing = { workspace = true }
sha2 = { workspace = true }
web-time = "1"
k256 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Sockets are native-only; the Cloudflare Worker notary brings its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-tungstenite = { workspace = true }
tokio = { workspace = true }
ws_stream_tungstenite = { workspace = true }

# Browser and extension builds connect with the WebSocket API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ws_stream_wasm = "0.7"
async_io_stream = "0.3"

[dev-dependencies]
tokio-util = { workspace = true }
