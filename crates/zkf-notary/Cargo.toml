[package]
name = "zkf-notary"
description = "zkfetch notary: MPC-TLS verifier + attestation signer"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["d1-experimental"]
# v2 (D1) attestations, selected per session by the prover. Experimental.
d1-experimental = ["tlsn/d1-experimental", "dep:zkf-attestation", "dep:zkf-ir"]

[[bin]]
name = "zkf-notary"
path = "src/main.rs"

[dependencies]
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
serde = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
zkf-core = { workspace = true }
zkf-attestation = { workspace = true, optional = true }
zkf-ir = { workspace = true, optional = true }
zkf-predicates = { workspace = true }
tlsn = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
tracing = { workspace = true }

# Socket server and binary; the Cloudflare Worker notary is wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
