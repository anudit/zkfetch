[package]
name = "zkf-ir"
description = "Reference circuit IR and AES gadgets for zkfetch v2"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
parallel = ["dep:rayon"]
mpz-backend = ["dep:anyhow", "dep:mpz-zk", "dep:mpz-vm-core", "dep:mpz-common", "dep:mpz-ot", "dep:serio", "dep:rand", "dep:rand_chacha"]

[dependencies]
rayon = {version="1",optional=true}
zkf-attestation.workspace = true
httparse = "1"
rustc-hash = "2"
sha2 = { workspace = true, features = ["compress"] }
thiserror.workspace = true
serde_json.workspace = true
zeroize = { version = "1", features = ["derive"] }
mpz-circuits = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["sha2"] }
anyhow = { workspace = true, optional = true }
mpz-zk = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", optional = true }
mpz-vm-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", optional = true }
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", optional = true }
mpz-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", default-features = false }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", optional = true }
serio = { version = "0.2", optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
aes-gcm = "0.10"
aes = "0.8"
hex.workspace = true
proptest = "1"
tokio.workspace = true
futures.workspace = true
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["test-utils", "executor"] }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["ideal"] }
